# Integración continua de CanchaYa API
# En cada push a main/develop y en cada Pull Request:
#   1) Auditoría de seguridad de dependencias
#   2) Pruebas unitarias + integración con Jest (con cobertura)
#   3) Pruebas de API con la colección de Postman ejecutada por Newman
#   4) Frontend: pruebas de componentes con Jest y compilación de producción
#   5) E2E: pruebas de UI con Selenium WebDriver (Page Object Model) en Chrome headless
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

# Mínimo privilegio: el pipeline solo necesita leer el código
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_ENV: test
  # BD efímera: un contenedor de MongoDB que solo existe durante el pipeline
  MONGODB_URI: mongodb://localhost:27017/canchas_test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  JWT_EXPIRES_IN: 1h

jobs:
  jest:
    name: Jest (unitarias + integración)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verificar que existe el secreto JWT_SECRET
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Falta el secreto JWT_SECRET en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Auditoría de seguridad de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/lcov-report
          retention-days: 14

  newman:
    name: Newman (colección de Postman)
    runs-on: ubuntu-latest
    needs: jest # solo se ejecuta si Jest pasó
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Cargar datos de prueba (usuario admin y canchas)
        run: node scripts/seed.js

      - name: Levantar la API en segundo plano
        run: |
          node src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API lista en $i segundos"
              exit 0
            fi
            sleep 1
          done
          echo "::error::La API no respondió en 30 segundos"
          cat api.log
          exit 1

      - name: Ejecutar la colección de Postman con Newman
        run: npm run test:api

      - name: Publicar reporte de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-newman
          path: reports/newman
          retention-days: 14

      - name: Mostrar el log de la API si algo falló
        if: failure()
        run: cat api.log

  frontend:
    name: Frontend (Jest de componentes + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Pruebas de componentes con cobertura
        run: npm run test:coverage

      - name: Compilar para producción
        run: npm run build

      - name: Publicar reporte de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-frontend
          path: frontend/coverage/lcov-report
          retention-days: 14

  e2e:
    name: E2E (Selenium + Page Object Model)
    runs-on: ubuntu-latest
    needs: [jest, frontend] # la UI se prueba solo si la lógica y los componentes ya pasaron
    timeout-minutes: 20
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://localhost:27017/canchas_e2e
      HEADLESS: 'true'
      BROWSER: chrome

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias (API, frontend y e2e)
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Cargar datos de prueba y levantar la API
        run: |
          node scripts/seed.js
          node src/server.js > api.log 2>&1 &
          npx wait-on --timeout 30000 http-get://localhost:3000/api/health

      - name: Levantar el frontend
        working-directory: frontend
        run: |
          npx vite --host localhost --port 5173 --strictPort > ../frontend.log 2>&1 &
          npx wait-on --timeout 60000 http-get://localhost:5173

      - name: Ejecutar las pruebas de Selenium
        working-directory: e2e
        run: npx jest --runInBand

      - name: Publicar capturas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-selenium
          path: e2e/capturas
          retention-days: 14

      - name: Mostrar los logs si algo falló
        if: failure()
        run: |
          cat api.log
          cat frontend.log
